# Builds dRally.nro with the devkitPro container. Run it by hand from the Actions tab.
# Not verified on GitHub yet.
name: Switch build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Switch SDL2
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm switch-dev switch-sdl2
      - name: Host tests
        run: tests/run.sh
      - name: Build
        run: make -f Makefile.switch
      - uses: actions/upload-artifact@v4
        with:
          name: dRally-nro
          path: dRally.nro
